<meta charset="utf-8">
<title>NEO · Protótipo v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de desktop com barra lateral fixa, barra superior com os seletores de plano e tema, e uma área de conteúdo em grade de cards */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F3F6F5; --line:#E2E7E5; --ink:#14161A; --muted:#5F6663;
  --brand:#0A7A52; --brand-ink:#FFFFFF; --brand-soft:#DDF7EC; --accent:#1AE299; --btn-bg:#14161A; --btn-ink:#FFFFFF;
  --good:#2563B8; --good-soft:#E3ECF9;
  --pos:#0A7A52; --pos-soft:#DDF7EC; --neg:#B42335; --neg-soft:#F8E3E6; --warn:#9A5A06; --warn-soft:#FBEFD9;
  --shade:rgba(20,22,26,.07);
  --f-display:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D0F; --surface:#171A1E; --surface-2:#1F2429; --line:#272C31; --ink:#F4F9F7; --muted:#98A19D;
  --brand:#1AE299; --brand-ink:#14161A; --brand-soft:#12352A; --accent:#1AE299; --btn-bg:#1AE299; --btn-ink:#14161A;
  --good:#7FB2F5; --good-soft:#172A44;
  --pos:#1AE299; --pos-soft:#12352A; --neg:#F07A86; --neg-soft:#3A1A20; --warn:#E7B35A; --warn-soft:#3A2C12;
  --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D0F; --surface:#171A1E; --surface-2:#1F2429; --line:#272C31; --ink:#F4F9F7; --muted:#98A19D;
  --brand:#1AE299; --brand-ink:#14161A; --brand-soft:#12352A; --accent:#1AE299; --btn-bg:#1AE299; --btn-ink:#14161A;
  --good:#7FB2F5; --good-soft:#172A44;
  --pos:#1AE299; --pos-soft:#12352A; --neg:#F07A86; --neg-soft:#3A1A20; --warn:#E7B35A; --warn-soft:#3A2C12;
  --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
.small{font-size:.82rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.08em;padding:0 10px;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border:2px solid var(--brand-ink);border-radius:3px}
nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;font-weight:500;color:var(--muted)}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-btn .lk{margin-left:auto;width:14px;height:14px;opacity:.8}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.8rem;padding-block:6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.top .who{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.8rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.seg-label{font-size:.78rem;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:8px}
.btn-ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem}
.btn-ghost:hover{background:var(--surface-2)}
.badge-plan{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge-plan.premium{background:var(--brand-soft);color:var(--brand)}

.content{padding-block:26px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1840px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted)}
.page-head .right{margin-left:auto}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px}
.card-head .right{margin-left:auto}
.kpi .label{font-size:.8rem;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.kpi .val small{font-size:.7em;font-weight:600}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;font-size:.85rem}
.link:hover{text-decoration:underline}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:.88rem;background:var(--brand);color:var(--brand-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.brand{background:var(--brand-soft);color:var(--brand)}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted)}
.row .amt{font-weight:600;white-space:nowrap}
.ico{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);flex:none}

.tbl-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.rec td{background:var(--brand-soft)}

/* bloqueio Premium */
.lockwrap{position:relative;min-width:0}
.lockwrap.is-locked>.lock-content{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
.lock-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:2}
.lock-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shade);padding:16px 18px;max-width:340px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.lock-box .lk-t{display:flex;gap:8px;align-items:center;font-weight:600;font-family:var(--f-display)}
.lock-box svg{width:18px;height:18px;color:var(--brand)}
.lock-box p{font-size:.88rem;color:var(--muted)}

/* gráficos */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;font-size:.86rem}
.bar-track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:99px}
.bar-fill.neg{background:var(--neg)}
svg text{font-family:var(--f-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}

/* score */
.score-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.comp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.84rem}
.meter{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:6px}
.meter b{display:block;height:100%}

/* pendências de categoria */
.pend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pend-item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem}
.opt:hover{border-color:var(--brand);color:var(--brand)}

/* chat */
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;min-height:560px}
.msgs{display:flex;flex-direction:column;gap:16px;padding:4px 2px 18px}
.msg{max-width:min(720px,92%);display:flex;flex-direction:column;gap:10px}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:14px 14px 4px 14px}
.msg.bot{align-self:flex-start}
.msg.bot .who-l{font-size:.75rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.msg.bot .bubble{background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:4px 14px 14px 14px;display:flex;flex-direction:column;gap:10px}
.msg.bot table{font-size:.83rem;background:var(--surface);border-radius:8px}
.composer{margin-top:auto;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--pos)}
.wa{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.85rem}
.wa .b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* objetivos */
.goal{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:flex-start;gap:10px}
.goal-top .right{margin-left:auto}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog b{display:block;height:100%;background:var(--brand)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:.84rem}
.facts div{display:flex;flex-direction:column}
.facts b{font-weight:600}
.choice{background:var(--warn-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.choice .opts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice button:hover{border-color:var(--brand)}
.choice button b{font-weight:600}

/* crédito */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.debt{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;width:100%}
.debt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:.86rem}
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.compare .big{font-family:var(--f-display);font-size:1.5rem;font-weight:700}

/* marketplace */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fopt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fopt:hover{border-color:var(--brand)}
.fopt.sel{border-color:var(--brand);background:var(--brand-soft)}
.fform{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fin{display:flex;gap:8px;width:100%;max-width:460px}
.fin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.funnel h2{margin-top:4px}
.rec-box{border:1px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rec-box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.g-score{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.score-num{display:flex;align-items:baseline;gap:8px}
.score-num b{font-family:var(--f-display);font-size:3.2rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.lockwrap{display:flex;flex-direction:column}
.lockwrap>.card,.lockwrap>.lock-content{flex:1}
.lock-content{display:flex;flex-direction:column}
.lock-content>.card{flex:1}
.lockwrap.is-locked{min-height:210px}
.card-note{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand-t{color:var(--brand);font-weight:600}
.refbar{position:relative;height:10px;background:var(--surface-2);border-radius:99px;width:170px;flex:none}
.refbar b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand)}
.refbar b.over{background:var(--neg)}
.refbar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.bands{display:grid;grid-template-columns:4fr 2fr 2fr 2fr;gap:3px;position:relative}
.bands span{height:8px;border-radius:99px}
.bands i{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.bands.lbl{margin-top:8px}
.bands.lbl span{height:auto;font-size:.74rem;color:var(--muted);line-height:1.35}
.comp-list{display:flex;flex-direction:column}
.comp-row{display:flex;align-items:center;gap:18px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.comp-row:first-child{border-top:0;padding-top:0}
.comp-row .grow{flex:1;min-width:220px}
.comp-val{width:240px;max-width:100%;display:flex;flex-direction:column;gap:6px}
.comp-val .meter{margin:0}
.search{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);font:inherit;width:320px;max-width:100%}
.pf-item{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;width:100%;font-size:.85rem}
.pf-item:hover{background:var(--surface-2)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,22,.6);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:540px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dl{display:grid;grid-template-columns:minmax(130px,auto) 1fr;gap:8px 16px;font-size:.92rem}
.field{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);font:inherit}
.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-bar .op-btn{margin-left:auto;border:1px solid currentColor;background:none;color:inherit;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:40;box-shadow:0 8px 24px var(--shade)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.chat-layout{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row}
  .nav-btn span.lbl{display:none}
  .side-foot{display:none}
  .g4,.g3,.g2,.g-score{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .facts{grid-template-columns:1fr 1fr}
  .bar-row{grid-template-columns:96px 1fr 84px}
  .top .who{margin-left:0}
}

.col{display:flex;flex-direction:column;gap:16px}
.g-home{grid-template-columns:repeat(3,minmax(0,1fr))}
.lockwrap>.sc,.lock-content>.sc,.lockwrap>.col,.lock-content>.col{flex:1}
.sc{background:#0f1b2d;color:#e9eef6;border:1px solid #1e2e47;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sc-t{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8fa3bf;font-weight:600}
.sc-ring{align-self:center;max-width:100%}
.sc-band{font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-align:center}
.sc-sub{text-align:center;font-size:.82rem;color:#8fa3bf;margin-top:2px}
.sc-list{display:flex;flex-direction:column;gap:11px}

function lineChart(series, labels, o={}){
  const W=o.w||640,H=o.h||210,pl=o.pl||70,pr=16,pt=14,pb=28;
  const all=series.flatMap(s=>s.data);
  let mn=Math.min(0,...all), mx=Math.max(...all);
  if(o.min!==undefined) mn=o.min;
  const pad=(mx-mn)*0.08; if(o.max!==undefined) mx=o.max; else mx+=pad; if(mn<0) mn-=pad;
  const X=i=>pl+i*(W-pl-pr)/(labels.length-1), Y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ticks=4, step=(mx-mn)/ticks;
  let g='';
  for(let i=0;i<=ticks;i++){const v=mn+i*step;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${o.fmt?o.fmt(v):R0(v)}</text>`}
  if(mn<0) g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--neg)" stroke-width="1" stroke-dasharray="4 4"/>`;
  const every=o.every||1;
  labels.forEach((l,i)=>{if(i%every===0||i===labels.length-1) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`});
  series.forEach(s=>{
    const d=s.data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    if(s.area){g+=`<path d="${d} L${X(s.data.length-1)} ${Y(Math.max(mn,0))} L${X(0)} ${Y(Math.max(mn,0))}Z" fill="${s.color}" fill-opacity=".10"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    const li=s.data.length-1; g+=`<circle cx="${X(li)}" cy="${Y(s.data[li])}" r="3.5" fill="${s.color}"/>`;
  });
  if(o.mark){const i=o.mark.i,v=series[0].data[i];g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="var(--neg)"/><text x="${X(i)+8}" y="${Y(v)+16}" font-size="11.5" font-weight="600" fill="var(--neg)">${o.mark.label}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.aria||'Gráfico'}">${g}</svg>`;
}

function apos(aporte, idadeAlvo){
  const n=(idadeAlvo-AP.idade)*12, rm=Math.pow(1+AP.real,1/12)-1;
  const fvCur=AP.prev*Math.pow(1+rm,n), fac=(Math.pow(1+rm,n)-1)/rm;
  const need=AP.renda*12/AP.real, proj=fvCur+aporte*fac;
  return {need, proj, renda:proj*AP.real/12, aporteNec:(need-fvCur)/fac};
}

function serieApos(aporte){const rm=Math.pow(1+AP.real,1/12)-1, out=[];for(let y=0;y<=AP.alvo-AP.idade;y++){const n=y*12;out.push(AP.prev*Math.pow(1+rm,n)+aporte*(Math.pow(1+rm,n)-1)/rm)}return out}

function pmt(pv,i,n){return pv*i/(1-Math.pow(1+i,-n))}

const SC_COL={pos:'#1AE299',warn:'#F2B544',neg:'#f47c6c',good:'#7FB2F5',brand:'#1AE299'};

function scoreHome(){
  const v=SCORE.v, b=bandOf(v), dv=(v-SCORE.prev)/SCORE.prev*100, r=62, c=2*Math.PI*r, col=SC_COL[b[3]];
  return `<div class="sc" data-go="score">

    <div><div class="sc-band" style="color:${col}">${b[2]}</div><div class="sc-sub">${dv>=0?'Subiu':'Caiu'} ${P(Math.abs(dv),0)}% nos últimos 30 dias</div></div>
    <div class="sc-list">${SCORE.comps.map((k,i)=>{const p=Math.round(k[2]/k[3]*100);return `<div class="sc-f"><span>${SC_NAME[i]}</span><b>${p}</b><div class="sc-bar"><i style="width:${p}%;background:${SC_COL[k[4]]}"></i></div></div>`}).join('')}</div>

/* ---------- SCORE ---------- */
function vScore(){

function parseGoal(q){

  let valor=null, m=t.match(/(\d+(?:[.,]\d+)?)\s*(mil|k)\b/);
  if(m) valor=Math.round(parseFloat(m[1].replace(',','.'))*1000);
  else if((m=t.match(/r\$\s*([\d.]+)/))) valor=Number(m[1].replace(/\./g,''));
  else if((m=t.match(/\b(\d{4,7})\b/))&&Number(m[1])>2100) valor=Number(m[1]);
  let prazo=null; m=t.match(/(\d+)\s*(anos?|mes(?:es)?|mês)/);
  if(m) prazo=Number(m[1])*(m[2][0]==='a'?12:1); else if(/ano que vem|pr[oó]ximo ano/.test(t)) prazo=12;
  const nome=/viage|viaj/.test(t)?'Viagem':/casa|apartamento|im[oó]vel/.test(t)?'Casa própria':/carro|moto/.test(t)?'Trocar de carro':/faculdade|escola|estud|curso/.test(t)?'Estudos':/reforma/.test(t)?'Reforma':/neg[oó]cio|empresa/.test(t)?'Negócio próprio':'Novo objetivo';
  const isGoal=/(sonh|objetivo|meta|plano|planej|quer(o|emos|ia|[ií]amos)|pretend|vamos|juntar|guardar)/.test(t);
  return {valor,prazo,nome,isGoal};
}

  const composer=ph=>`<form class="composer" id="composer"><input id="ask" type="text" placeholder="${ph}" autocomplete="off" aria-label="Mensagem para o assistente"><button class="btn" type="submit">Enviar</button></form>`;
  const side=`<div class="card as-side">
      <button class="btn" type="button" data-act="conv-new">Nova conversa</button>
      <span class="small muted" style="padding:6px 10px 0">Conversas anteriores</span>
      <div class="as-list">${S.convs.map(c=>`<button class="as-conv" type="button" data-conv="${c.id}" aria-current="${c.id===cur}"><span class="t">${c.t}</span><span class="small muted">${c.d}</span></button>`).join('')}</div>
    </div>`;
  const main=cv?`<div class="card chat"><div class="card-head"><h2>${cv.t}</h2><span class="small muted right">${cv.d}</span></div>
      <div class="msgs">${cv.preset?carPreset():''}${cv.msgs.map(m=>`${m.q?`<div class="msg user">${m.q}</div>`:''}<div class="msg bot"><span class="who-l">Assistente NEO</span><div class="bubble">${m.prop?propHtml(m.prop):m.a}</div></div>`).join('')}</div>
      ${composer('Continue a conversa ou peça para ajustar o plano')}</div>`
    :`<div class="card as-empty">
      <h2>Como posso te ajudar hoje, João?</h2>
      <p class="muted" style="max-width:520px">Pergunte sobre as contas da família, peça ajuda para decidir ou conte um sonho. Quando for um objetivo, eu levo para o Plano financeiro.</p>
      ${composer('Pergunte sobre suas finanças ou conte um objetivo')}
      <div class="sugs">${[...Object.keys(ANS),GOAL_EX].map(q=>`<button class="opt" type="button" data-ask="${q}">${q}</button>`).join('')}</div>
    </div>`;
  return `<div class="page-head"><div><h1>Assistente financeiro</h1><p>Tira dúvidas, ajuda a decidir e monta o plano com todas as informações da família.</p></div></div>
  ${lock(`<div class="as-layout">${side}${main}</div>`,'Assistente financeiro','Assine o Premium para conversar com o assistente. Ele usa suas contas, financiamentos, família e plano para indicar o melhor caminho.')}`;
}

/* ---------- PLANO ---------- */
function vPlano(){
  const atual=apos(AP.aporte,AP.alvo);
  const idade=idadeQueAtinge(AP.aporte);
  const sAtual=serieApos(AP.aporte), sMeta=serieApos(atual.aporteNec);
  const labs=sAtual.map((_,i)=>String(AP.idade+i));
  const patrimonio=contas[2].saldo+contas[3].saldo+AP.prev;
  // casamento
  const C={alvo:36000,guardado:9000,mensal:3000,prazo:'jun/2027'};
  let cas;
  if(S.casamento==='aumentar') cas={status:['No ritmo','pos'],mensal:27000/8,prazo:'jun/2027',nota:'Aportes ajustados para R$ 3.375,00 de novembro a junho.'};
  else if(S.casamento==='adiar') cas={status:['No ritmo','pos'],mensal:3000,prazo:'jul/2027',nota:'Meta adiada em 1 mês, mantendo R$ 3.000,00 por mês.'};
  else cas={status:['Em risco','warn'],mensal:3000,prazo:'jun/2027',nota:null};
  const casChoice=S.casamento?`<p class="small muted">${cas.nota} <button class="link" data-act="cas-reset">Desfazer</button></p>`:`<div class="choice"><b>Outubro ficou sem aporte.</b><span class="small">Para casar em junho de 2027, escolha como recuperar:</span><div class="opts2">
      <button type="button" data-act="cas-aumentar"><b>Aumentar os próximos aportes</b><span class="small muted">R$ 3.375,00 por mês, de novembro a junho</span></button>
      <button type="button" data-act="cas-adiar"><b>Adiar o casamento em 1 mês</b><span class="small muted">Mantém R$ 3.000,00 por mês, meta em julho de 2027</span></button></div></div>`;
  let ap;
  const misto=apos(0,65).aporteNec;
  if(S.aposentadoria==='misto') ap={status:['No ritmo','pos'],txt:`Aporte de ${R(misto)} por mês e aposentadoria aos 65 anos.`};
  else if(S.aposentadoria==='aporte') ap={status:['No ritmo','pos'],txt:`Aporte ajustado para ${R(atual.aporteNec)} por mês.`};
  else if(S.aposentadoria==='idade') ap={status:['No ritmo','pos'],txt:`Mantém ${R(AP.aporte)} por mês e se aposenta aos ${idade} anos.`};
  else ap={status:['Abaixo da meta','warn'],txt:null};
  const apChoice=S.aposentadoria?`<p class="small muted">${ap.txt} <button class="link" data-act="ap-reset">Desfazer</button></p>`:`<div class="choice"><b>No ritmo atual, a renda projetada aos 60 é de ${R0(atual.renda)} por mês.</b><span class="small">A meta é ${R0(AP.renda)}. Escolha como chegar lá:</span><div class="opts2">
      <button type="button" data-act="ap-aporte"><b>Aumentar o aporte</b><span class="small muted">${R(atual.aporteNec)} por mês até os 60</span></button>
      <button type="button" data-act="ap-idade"><b>Aposentar mais tarde</b><span class="small muted">Mantém ${R0(AP.aporte)} por mês e chega lá aos ${idade}</span></button>
      <button type="button" data-act="ap-misto"><b>Um pouco de cada</b><span class="small muted">${R(misto)} por mês e aposentadoria aos 65</span></button></div></div>`;
  const apAporte=S.aposentadoria==='aporte'?atual.aporteNec:S.aposentadoria==='misto'?misto:AP.aporte;
  const off=S.off, paused=k=>`<p class="small muted">Pausado na conversa com o assistente. O que já foi guardado continua no plano. <button class="link" data-act="on-${k}">Reativar</button></p>`;
  const chipP='<span class="chip right">Pausado</span>';
  const gOn=S.goals.filter(g=>!g.off);
  const aporteTot=(off.cas?0:cas.mensal)+(off.ap?0:apAporte)+gOn.reduce((a,g)=>a+g.aporte,0);
  const ativos=['cas','ap','res'].filter(k=>!off[k]).length+gOn.length;
  const atencao=(!off.cas&&cas.status[0]!=='No ritmo'?1:0)+(!off.ap&&ap.status[0]!=='No ritmo'?1:0)+gOn.filter(g=>g.fit[1]!=='pos').length;
  const maxM=Math.max(...meses.flatMap(m=>[m[1],m[2]]));
  const fluxo=`<div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px">${meses.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><div style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center"><div title="Entradas ${R(m[1])}" style="width:38%;height:${m[1]/maxM*100}%;background:var(--pos);border-radius:4px 4px 0 0"></div><div title="Saídas ${R(m[2])}" style="width:38%;height:${m[2]/maxM*100}%;background:var(--muted);opacity:.55;border-radius:4px 4px 0 0"></div></div><span class="small muted">${m[0]}</span></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--muted)"></i>Saídas</span></div>`;
  const inner=`<div style="display:flex;flex-direction:column;gap:16px">
  ${S.planNote?`<div class="note"><span class="grow">${S.planNote} Confira abaixo se o plano está como vocês querem.</span><button class="link" type="button" data-act="note-x">Entendi</button></div>`:''}
  <div class="grid g4">
    <div class="card kpi"><span class="label">Patrimônio hoje</span><span class="val">${R(patrimonio)}</span><span class="sub">Poupança, investimentos e previdência</span></div>
    <div class="card kpi"><span class="label">Aporte mensal combinado</span><span class="val">${R(aporteTot)}</span><span class="sub">Soma dos objetivos ativos</span></div>
    <div class="card kpi"><span class="label">Objetivos ativos</span><span class="val">${ativos}</span><span class="sub">${atencao} ${atencao===1?'pede':'pedem'} atenção</span></div>
    <div class="card kpi"><span class="label">Sobra em outubro</span><span class="val pos">${R(563.55)}</span><span class="sub">Depois dos gastos e dos aportes</span></div>
  </div>
  <div class="card"><div class="card-head"><h2>Crescimento do patrimônio para a aposentadoria</h2><span class="small muted right">idade de João · valores de hoje</span></div>
    ${lineChart([{data:sMeta,color:'var(--pos)',dash:true},{data:sAtual,color:'var(--brand)',area:true}],labs,{every:2,w:1000,h:300,pl:80,fmt:v=>v>=1e6?'R$ '+P(v/1e6,1)+' mi':v>=1e3?'R$ '+P(v/1e3,0)+' mil':'R$ 0',aria:'Patrimônio projetado por idade'})}
    <div class="legend"><span><i style="background:var(--brand)"></i>Ritmo atual: ${R0(AP.aporte)} por mês</span><span><i style="background:var(--pos)"></i>Ritmo para a meta: ${R0(atual.aporteNec)} por mês</span></div>
    <p class="small muted">Hipótese: rentabilidade real de 4% ao ano, já descontada a inflação, definida com o assistente. Não é promessa de retorno.</p></div>
  <div class="grid g2">
    <div class="goal ${off.cas?'off':''}"><div class="goal-top"><div><h3>Casamento</h3><span class="small muted">${R0(C.alvo)} até ${cas.prazo}</span></div>${off.cas?chipP:`<span class="chip ${cas.status[1]} right">${cas.status[0]}</span>`}</div>
      <div class="prog"><b style="width:${C.guardado/C.alvo*100}%"></b></div>
      <div class="facts"><div><span class="muted">Guardado</span><b>${R0(C.guardado)}</b></div><div><span class="muted">Falta</span><b>${R0(C.alvo-C.guardado)}</b></div><div><span class="muted">Aporte</span><b>${R(cas.mensal)}</b></div><div><span class="muted">Aportes feitos</span><b>3 de 4</b></div></div>
      ${off.cas?paused('cas'):casChoice}</div>
    <div class="goal ${off.ap?'off':''}"><div class="goal-top"><div><h3>Aposentadoria aos 60</h3><span class="small muted">${R0(AP.renda)} por mês de renda, em valores de hoje</span></div>${off.ap?chipP:`<span class="chip ${ap.status[1]} right">${ap.status[0]}</span>`}</div>
      <div class="prog"><b style="width:${Math.min(100,atual.proj/atual.need*100)}%"></b></div>
      <div class="facts"><div><span class="muted">Precisa ter</span><b>${R0(atual.need)}</b></div><div><span class="muted">Projeção atual</span><b>${R0(atual.proj)}</b></div><div><span class="muted">Aporte</span><b>${R0(apAporte)}</b></div><div><span class="muted">Rentab. alvo</span><b>4% real a.a.</b></div></div>
      ${off.ap?paused('ap'):apChoice}</div>
    <div class="goal ${off.res?'off':''}"><div class="goal-top"><div><h3>Reserva de emergência</h3><span class="small muted">${R0(42000)}, 3 meses de despesas</span></div>${off.res?chipP:'<span class="chip right">Começa em jul/2027</span>'}</div>
      <div class="prog"><b style="width:${6250/42000*100}%"></b></div>
      <div class="facts"><div><span class="muted">Guardado</span><b>${R0(6250)}</b></div><div><span class="muted">Falta</span><b>${R0(35750)}</b></div><div><span class="muted">Aporte</span><b>${R0(3000)}</b></div><div><span class="muted">Previsão</span><b>jun/2028</b></div></div>
      ${off.res?paused('res'):'<p class="small muted">Recebe o aporte do casamento quando ele terminar.</p>'}</div>
    ${S.goals.map((g,gi)=>`<div class="goal ${g.off?'off':''}"><div class="goal-top"><div><h3>${g.nome}</h3><span class="small muted">${R0(g.valor)} em ${g.prazo} meses</span></div>${g.off?chipP:`<span class="chip ${g.fit[1]} right">${g.fit[1]==='pos'?'No ritmo':g.fit[0]}</span>`}</div><div class="prog"><b style="width:${g.guardado/g.valor*100}%"></b></div><div class="facts"><div><span class="muted">Guardado</span><b>${R0(g.guardado)}</b></div><div><span class="muted">Falta</span><b>${R0(g.valor-g.guardado)}</b></div><div><span class="muted">Aporte</span><b>${R(g.aporte)}</b></div><div><span class="muted">Criado</span><b>hoje</b></div></div>${g.off?`<p class="small muted">Pausado na conversa com o assistente. <button class="link" data-act="on-g" data-i="${gi}">Reativar</button></p>`:g.src?'<p class="small muted">Criado a partir da conversa com o assistente.</p>':''}</div>`).join('')}
    <div class="card"><h2>Receitas e despesas</h2>${fluxo}</div>
  </div></div>`;
  return `<div class="page-head"><div><h1>Plano financeiro</h1><p>O plano que vocês montaram com o assistente e o acompanhamento de cada objetivo.</p></div>${S.premium?'<div class="right btn-row"><button class="btn sec" data-go="assistente">Ajustar com o assistente</button><button class="btn" data-act="ng-open">Novo objetivo</button></div>':''}</div>
  ${S.premium&&S.ngOpen?vFunnel('objetivo'):''}
  ${lock(inner,'Plano financeiro','Assine o Premium para montar seu plano com o assistente e acompanhar cada objetivo mês a mês.')}`;
}

/* ---------- CRÉDITO ---------- */
function vCredito(){
  const iV=0.0239, nV=21, parcV=1486.27, sdV=saldoDev(parcV,iV,nV);
  const iN=0.0172, novaV=pmt(sdV,iN,nV);
  const debts={
    veiculo:{nome:'Financiamento do carro',inst:'Banco Alfa',det:`Contratado em mar/2024 · 48 parcelas · restam ${nV}`,taxa:2.39,bcb:1.95,mes:'março de 2024',saldo:sdV,parc:parcV,mod:'Financiamento de veículo, pessoa física'},
    rotativo:{nome:'Rotativo do cartão',inst:'Banco Alfa',det:'Saldo financiado desde setembro de 2026',taxa:13.9,bcb:14.2,mes:'outubro de 2026',saldo:4120,parc:612.40,mod:'Cartão de crédito rotativo, pessoa física'},
    pessoal:{nome:'Empréstimo pessoal',inst:'Banco Beta',det:'Contratado em jun/2025 · 24 parcelas · restam 8',taxa:5.9,bcb:3.4,mes:'junho de 2025',saldo:1610,parc:220,mod:'Crédito pessoal não consignado'}
  };
  const d=debts[S.debt], ratio=d.taxa/d.bcb;
  const irregular=ratio>=1.5;
  const totalSaldo=Object.values(debts).reduce((a,x)=>a+x.saldo,0);
  const totalParc=Object.values(debts).reduce((a,x)=>a+x.parc,0);
  let next='';
  if(S.debt==='veiculo') next=`<div class="card" style="background:var(--surface-2)"><h3>Portabilidade: ofertas encontradas</h3>
      <div class="tbl-box"><table><thead><tr><th>Banco</th><th class="num">Taxa</th><th class="num">Nova parcela</th><th class="num">Economia total</th></tr></thead><tbody>
      <tr class="rec"><td><b>Banco Delta</b></td><td class="num">1,72% a.m.</td><td class="num">${R(novaV)}</td><td class="num pos">${R((parcV-novaV)*nV)}</td></tr>
      <tr><td>Banco Épsilon</td><td class="num">1,89% a.m.</td><td class="num">${R(pmt(sdV,0.0189,nV))}</td><td class="num pos">${R((parcV-pmt(sdV,0.0189,nV))*nV)}</td></tr>
      </tbody></table></div><div class="btn-row"><button class="btn" type="button" data-act="portab">Pedir a portabilidade</button><button class="btn sec" type="button" data-act="reneg">Tentar renegociar com o Banco Alfa</button></div></div>`;
  else if(S.debt==='rotativo') next=`<div class="card" style="background:var(--surface-2)"><h3>Saída sugerida: trocar a dívida por uma mais barata</h3>
      <p class="small">O rotativo está na média do mercado, mas é o crédito mais caro que existe. Trocar ${R0(4120)} por um crédito pessoal em 12x a 3,6% a.m. reduz os juros de cerca de R$ 600 para cerca de R$ 150 por mês no começo.</p>
      <div class="btn-row"><button class="btn" type="button" data-go="marketplace" data-mkt="pessoal" data-pre="pessoal:fim=quitar,gar=sem,valor=4120,prazo=12">Ver crédito pessoal no Marketplace</button></div></div>`;
  else next=`<div class="card" style="background:var(--neg-soft)"><h3>Indício de juros acima do mercado</h3>
      <p class="small">A taxa contratada é ${P(ratio,2)} vezes a média do BCB para a modalidade no mês da contratação. Pelo critério usado nos tribunais, isso indica possível abusividade.</p>
      <div class="btn-row"><button class="btn" type="button" data-act="juridico">Falar com um advogado parceiro</button><button class="btn sec" type="button" data-act="reneg">Tentar renegociar antes</button></div></div>`;
  return `<div class="page-head"><div><h1>Crédito</h1><p>Analisamos seus contratos e seus créditos atuais em busca de um custo menor.</p></div></div>
  <div class="grid g4">
    <div class="card kpi"><span class="label">Dívidas ativas</span><span class="val">3</span><span class="sub">Lidas pelo Open Finance</span></div>
    <div class="card kpi"><span class="label">Saldo devedor total</span><span class="val">${R(totalSaldo)}</span><span class="sub">Somando as três</span></div>
    <div class="card kpi"><span class="label">Parcelas e juros por mês</span><span class="val">${R(totalParc)}</span><span class="sub">16% da renda da família</span></div>
    <div class="card kpi"><span class="label">Economia possível</span><span class="val pos">${R((parcV-novaV)*nV)}</span><span class="sub">Com a portabilidade do carro</span></div>
  </div>
  <div class="grid g-main">
    <div class="card"><div class="card-head"><h2>Análise: ${d.nome}</h2><span class="chip ${irregular?'neg':ratio>1.1?'warn':'pos'} right">${irregular?'Possível abusividade':ratio>1.1?'Acima da média':'Dentro da média'}</span></div>
      <div class="steps">
        <div class="step"><span class="n">1</span><div><b>Contrato lido</b><p class="small muted">${d.inst} · ${d.det}</p></div></div>
        <div class="step"><span class="n">2</span><div><b>Modalidade identificada</b><p class="small muted">${d.mod}</p></div></div>
        <div class="step"><span class="n">3</span><div><b>Comparação com a média do BCB em ${d.mes}</b>
          <div class="compare" style="margin-top:10px"><div><div class="big">${P(d.taxa,2)}%</div><span class="small muted">sua taxa ao mês</span></div><div class="small muted">${P(ratio,2)}x</div><div><div class="big">${P(d.bcb,2)}%</div><span class="small muted">média do BCB ao mês</span></div></div>
          <p class="small muted" style="margin-top:8px">No produto real, a média vem da série oficial do BCB do mês da contratação. Neste protótipo, o valor é de exemplo.</p></div></div>
        <div class="step"><span class="n">4</span><div><b>Próximo passo</b><p class="small muted">${irregular?'Caminho jurídico, com advogado parceiro.':S.debt==='veiculo'?'Sem indício de abusividade. Buscamos uma taxa menor em outros bancos (portabilidade) ou renegociamos com o seu banco.':'Taxa na média, mas cara. A melhor saída é trocar a dívida.'}</p></div></div>
      </div>
      ${next}
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h2>Seus créditos</h2>
        ${Object.entries(debts).map(([k,x])=>`<button class="debt" type="button" data-debt="${k}" aria-pressed="${S.debt===k}"><span style="display:flex;gap:8px;width:100%"><b class="grow">${x.nome}</b><span class="chip ${x.taxa/x.bcb>=1.5?'neg':x.taxa/x.bcb>1.1?'warn':'pos'}">${P(x.taxa/x.bcb,2)}x</span></span><span class="small muted">${x.inst} · ${P(x.taxa,2)}% a.m. · saldo ${R0(x.saldo)}</span></button>`).join('')}
      </div>
      <div class="card"><h2>Tem outro contrato?</h2><div class="drop">Envie o contrato em PDF ou foto. Analisamos consignado, cartão benefício, RCC, veículo, imóvel e crédito pessoal.</div><button class="btn sec" type="button" data-act="upload">Enviar contrato</button></div>
      ${S.premium?'':`<div class="card" style="background:var(--brand-soft);border-color:transparent"><h3>Monte com o assistente um plano para sair das dívidas</h3><p class="small">No Premium, o assistente organiza a ordem de quitação e acompanha cada mês.</p><button class="btn" type="button" data-act="assinar">Assinar o Premium</button></div>`}
    </div>
  </div>`;
}

function fState(k){return S.f[k]||(S.f[k]={a:{},i:0,done:false})}
function fSteps(F,a){return F.steps.filter(s=>!s.when||s.when(a))}
function fmtAns(s,a){const v=a[s.id];if(s.type==='money') return s.raw?v.toLocaleString('pt-BR'):R0(v);if(s.type==='text') return v||'Não informado';const o=s.opts(a).find(o=>String(o.v)===String(v));return o?o.l:String(v)}
function vFunnel(k){
  const F=FUN[k]||(k==='objetivo'?GOALF:null), st=fState(k), steps=fSteps(F,st.a), pre=S.premium&&F.pre?F.pre():{};
  const carNote=k==='auto'&&S.car?`<p class="small muted">Usando os dados salvos do seu carro: ${S.car.modelo||'carro'} · CEP ${S.car.cep||'não informado'}. <button class="link" data-act="editcar">Editar</button></p>`:'';
  const summary=steps.slice(0,st.done?steps.length:st.i).map((s,i)=>`<button class="chip" type="button" data-fe="${k}|${i}" title="Alterar">${fmtAns(s,st.a)}</button>`).join('');
  if(st.done&&F.custom){return `<div class="card"><div class="card-head"><h2>${F.nome}</h2></div><div class="opts">${summary}</div>${F.custom(st.a)}</div>`}
  if(st.done){
    const r=F.res(st.a);
    const recBox=`<div class="rec-box"><div class="card-head"><h3>Indicação da NEO: ${r.rows[r.rec][0]}</h3><span class="chip brand right">Para o seu caso</span></div><ul>${r.why.map(w=>`<li>${w}</li>`).join('')}</ul><p class="small muted">A indicação nunca considera a comissão que a NEO recebe.</p></div>`;
    return `<div class="card"><div class="card-head"><div><h2>${F.nome}</h2><p class="small muted">${r.sub}</p></div><div class="right btn-row"><button class="btn sec" type="button" data-fr="${k}">Refazer</button></div></div>
      <div class="opts">${summary}</div><span class="small muted">Toque numa resposta para alterar.</span>${carNote}</div>
      ${lock(recBox,'Qual faz mais sentido para você?','Saiba qual solução mais se encaixa na sua necessidade. Assine o Premium.')}
      <div class="card"><div class="card-head"><h2>Comparação</h2><span class="small muted right">Cotações de exemplo · 06/11/2026</span></div>
      <div class="tbl-box"><table><thead><tr>${r.cols.map((c,i)=>`<th class="${i?'num':''}">${c}</th>`).join('')}<th></th></tr></thead><tbody>
      ${r.rows.map((row,ri)=>`<tr class="${S.premium&&ri===r.rec?'rec':''}">${row.map((c,i)=>`<td class="${i?'num':''}">${i===0&&S.premium&&ri===r.rec?`<b>${c}</b> <span class="chip brand">Indicada</span>`:c}</td>`).join('')}<td class="num"><button class="btn sec" type="button" data-act="contratar">Contratar</button></td></tr>`).join('')}
      </tbody></table></div>${r.extra?`<div class="btn-row">${r.extra}</div>`:''}</div>`;
  }
  const s=steps[st.i], n=steps.length;
  let body='';
  if(s.type==='choice') body=`<div class="fopts">${s.opts(st.a).map(o=>`<button class="fopt ${String(st.a[s.id])===String(o.v)?'sel':''}" type="button" data-fa="${k}|${s.id}|${o.v}"><b>${o.l}</b>${o.sub?`<span class="small muted">${o.sub}</span>`:''}${String(pre[s.id])===String(o.v)?'<span class="chip brand">Pelos seus dados</span>':''}</button>`).join('')}</div>`;
  else{const val=st.a[s.id]??pre[s.id]??'';
    body=`<form class="fform" data-ff="${k}|${s.id}|${s.type}"><div class="fin"><input id="fin-${k}" ${s.type==='money'?'inputmode="numeric"':''} type="text" value="${s.type==='money'&&val?Number(val).toLocaleString('pt-BR'):val}" placeholder="${s.ph||(s.raw?'Ex.: 1.000':'Ex.: 65.000')}" autocomplete="off"><button class="btn" type="submit">Continuar</button></div>
    ${s.sug?`<div class="opts">${s.sug(st.a).map(v=>`<button class="opt" type="button" data-fa="${k}|${s.id}|${v}">${s.raw?v.toLocaleString('pt-BR'):R0(v)}</button>`).join('')}</div>`:''}
    ${s.type==='text'?`<button class="link" type="button" data-fa="${k}|${s.id}|">Pular por enquanto</button>`:''}</form>`;}
  return `<div class="card funnel"><div class="card-head"><span class="small muted">${F.nome} · passo ${st.i+1} de ${n}</span>${st.i?`<button class="link right" type="button" data-fb="${k}">Voltar</button>`:''}</div>
    <div class="prog"><b style="width:${(st.i)/n*100}%"></b></div>
    ${summary?`<div class="opts">${summary}</div>`:''}${carNote}
    <h2 style="font-size:1.25rem">${s.q}</h2>${s.help?`<p class="small muted">${s.help}</p>`:''}
    ${body}
    ${S.premium&&F.pre&&st.i===0?`<p class="small muted">As opções marcadas "Pelos seus dados" vêm das suas contas e do seu plano.</p>`:''}</div>`;
}
function fAnswer(k,id,v){
  const F=FUN[k]||GOALF, st=fState(k), s=F.steps.find(x=>x.id===id);
  st.a[id]=s.type==='money'?Number(v):(s.type==='choice'&&/^\d+$/.test(v)?Number(v):v);
  const steps=fSteps(F,st.a); st.i=steps.findIndex(x=>x.id===id)+1;
  if(st.i>=steps.length){st.done=true;F.onDone&&F.onDone(st.a)}
  render();
}

  const g=parseGoal(q), m={q};
  if(ANS[q]) m.a=ANS[q]();
  else if((g.isGoal||cv.wait)&&g.valor){const prazo=g.prazo||24;m.prop=newProp({nome:g.nome==='Novo objetivo'&&cv.wait?cv.wait:g.nome,valor:g.valor,prazo,aporte:g.valor/prazo,intro:g.prazo?null:'Entendi que isso é um objetivo de vocês. Como não veio o prazo, considerei 24 meses.'});cv.wait=null}
  else if(g.isGoal){cv.wait=g.nome;m.a='<p>Isso parece um objetivo de vocês, e objetivos eu levo para o Plano financeiro. Para fazer a conta, me diga <b>quanto custa</b> e <b>para quando</b> vocês querem. Por exemplo: R$ 30 mil em 2 anos.</p>'}
  else m.a='<p>Neste protótipo, só as perguntas sugeridas e os objetivos têm resposta de exemplo. Na versão real, eu consultaria as contas, o perfil e o plano de vocês para responder, e mostraria de onde vem cada número.</p>';
  cv.msgs.push(m);render();scrollLast();const i=document.getElementById('ask');if(i) i.focus({preventScroll:true});
}
/* Home nova: o Premium vê o aviso de gastos sem categoria toda vez que abre a Home */

function maskText(t){return t.replace(/R\$\s?[\d.]+(,\d+)?/g,'R$ •••').replace(/\b\d+(,\d+)?\s?mil\b/g,'••• mil')}
function applyHide(){
  document.body.classList.toggle('hide-vals',S.hide);
  const b=document.getElementById('eyeBtn');if(b){b.innerHTML=S.hide?ICON.eyeOff:ICON.eye;b.setAttribute('aria-pressed',S.hide);const l=S.hide?'Mostrar valores':'Ocultar valores';b.setAttribute('aria-label',l);b.title=l}
  if(!S.hide) return;
  [document.getElementById('view'),document.querySelector('#modal .modal')].forEach(root=>{if(!root) return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const v=n.nodeValue;if(/R\$|\bmil\b/.test(v)){const m=maskText(v);if(m!==v) n.nodeValue=m}}
    root.querySelectorAll('[title]').forEach(el=>{el.title=maskText(el.title)});
  });
}

  go(ids[j]);const v=document.getElementById('view');v.classList.remove('sw-l','sw-r');void v.offsetWidth;v.classList.add(dx<0?'sw-l':'sw-r')},{passive:true});
